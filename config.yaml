geometry:
  finger_extension_angle: 150  # Угол > этого значения = палец разогнут
  finger_bend_angle: 130       # Угол < этого значения = палец согнут
  pinch_threshold_down: 0.04        # Расстояние между большим и указательным для клика 
  pinch_threshold_up: 0.07

filter:
  min_cutoff: 1.0      # меньше = сильнее сглаживание на низких скоростях
  beta: 0.007          # скорость реакции на резкие движения
  derivate_cutoff: 1.0

vision:
  min_detection_confidence: 0.7
  min_tracking_confidence: 0.5
  max_num_hands: 2

camera:
  width: 640
  height: 480
  fps_target: 30
  device_id: 0
  mirror: True

mouse:
  sensitivity: 10
  acceleration_factor: 0.08
  acceleration_deadzone: 2.0
  click_debounce_frames: 4
  scroll_threshold: 0.04
  scroll_cooldown_frames: 10

